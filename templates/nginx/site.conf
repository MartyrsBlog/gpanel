server {
    listen 80;
    server_name {{.Domain}} www.{{.Domain}};
    root {{.Path}};
    index index.php index.html index.htm;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # 隐藏Nginx版本
    server_tokens off;

    # 日志配置
    access_log /var/log/nginx/{{.Domain}}_access.log;
    error_log /var/log/nginx/{{.Domain}}_error.log;

    # 网站压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 静态文件缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 主页处理
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP处理
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php{{.PHPVersion}}-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # PHP安全设置
        fastcgi_param PHP_VALUE "open_basedir=$document_root/:/tmp/";
        fastcgi_param modHeadersAvailable true;
        fastcgi_intercept_errors on;
    }

    # 拒绝访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 拒绝访问备份文件
    location ~* \.(bak|backup|old|orig|save|tmp)$ {
        deny all;
    }

    # 限制上传文件大小
    client_max_body_size 100M;

    # 防止图片盗链
    location ~ \.(jpg|jpeg|png|gif|bmp|ico)$ {
        valid_referers none blocked server_names *.{{.Domain}};
        if ($invalid_referer) {
            return 403;
        }
    }
}

# HTTPS配置 (如果有SSL证书)
{{if .SSLEnabled}}
server {
    listen 443 ssl http2;
    server_name {{.Domain}} www.{{.Domain}};
    root {{.Path}};
    index index.php index.html index.htm;

    # SSL证书配置
    ssl_certificate {{.SSLCertPath}};
    ssl_certificate_key {{.SSLKeyPath}};
    
    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 其他配置与HTTP相同
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    server_tokens off;

    access_log /var/log/nginx/{{.Domain}}_ssl_access.log;
    error_log /var/log/nginx/{{.Domain}}_ssl_error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php{{.PHPVersion}}-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "open_basedir=$document_root/:/tmp/";
        fastcgi_param modHeadersAvailable true;
        fastcgi_intercept_errors on;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(bak|backup|old|orig|save|tmp)$ {
        deny all;
    }

    client_max_body_size 100M;

    location ~ \.(jpg|jpeg|png|gif|bmp|ico)$ {
        valid_referers none blocked server_names *.{{.Domain}};
        if ($invalid_referer) {
            return 403;
        }
    }
}

# HTTP重定向到HTTPS
server {
    listen 80;
    server_name {{.Domain}} www.{{.Domain}};
    return 301 https://$server_name$request_uri;
}
{{end}}