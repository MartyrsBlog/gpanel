version: '3.8'

services:
  gpanel:
    build: .
    container_name: gpanel
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./plugins:/app/plugins
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/www:/var/www:ro
      - /etc/nginx:/etc/nginx:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
    depends_on:
      - mysql
      - redis
    networks:
      - gpanel-network

  mysql:
    image: mysql:8.0
    container_name: gpanel-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: gpanel123456
      MYSQL_DATABASE: gpanel
      MYSQL_USER: gpanel
      MYSQL_PASSWORD: gpanel123456
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gpanel-network

  redis:
    image: redis:7-alpine
    container_name: gpanel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass gpanel123456
    volumes:
      - redis-data:/data
    networks:
      - gpanel-network

  nginx:
    image: nginx:alpine
    container_name: gpanel-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      - gpanel
    networks:
      - gpanel-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  gpanel-network:
    driver: bridge